<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" "https://www.w3.org/TR/html4/strict.dtd">
<html lang="en">
    <head>
        <meta http-equiv=Content-Type content="text/html; charset=UTF-8">
        <style type="text/css" nonce="Aia_fqp4WggAwLJUxUO-yQ">
            body,td,div,p,a,input {
                font-family: arial, sans-serif;
            }
        </style>
        <title>Gmail - Test Background</title>
    </head>
    <body>
        <div class="maincontent">
            <font size=+1>
                <b>Test Background</b>
            </font>
            <hr>
            <table width=100% cellpadding=0 cellspacing=0 border=0 class="message">
                <tr>
                    <td>
                        <font size=-1>
                            <b>Pinterest </b>
                            &lt;recommendations@inspire.pinterest.com &gt;
                        </font>
                    </td>
                    <td align=right>
                        <font size=-1>Tue, Jun 3, 2025 at 3:13 PM</font>
                        <tr>
                            <td colspan=2 style="padding-bottom: 4px;">
                                <font size=-1 class="recipient">
                                    <div>To: &quot;rxliuli@gmail.com &quot;&lt;rxliuli@gmail.com &gt;</div>
                                </font>
                                <tr>
                                    <td colspan=2>
                                        <table width=100% cellpadding=12 cellspacing=0 border=0>
                                            <tr>
                                                <td>
                                                    <div style="overflow: hidden;">
                                                        <!-- Trimmed down from a real Pinterest board mail: the big
                                                             collage tile is a legacy `background=` attribute on a
                                                             <td> (no element of its own for the dark-mode filter to
                                                             un-invert), next to real <img> tiles, plus the two
                                                             inline CSS background spellings. -->
                                                        <table border="0" cellpadding="0" cellspacing="0" style="table-layout:fixed;font-size:0;border-collapse:collapse" width="241">
                                                            <tbody>
                                                                <tr>
                                                                    <td align="center" background="https://ci3.googleusercontent.com/meips/cover=s0-d-e1-ft#https://i.pinimg.com/400x300/ff/9c/e5/ff9ce53887d76b1b072701cbbb6168bc.jpg" style="border-radius:16px 0 0 16px;background-size:cover;background-position:center;background-repeat:no-repeat">
                                                                        <a href="https://www.pinterest.com/">
                                                                            <div style="border-radius:16px 0 0 16px">
                                                                                <div style="display:block;height:241px;width:241px;opacity:0.97"> </div>
                                                                            </div>
                                                                        </a>
                                                                    </td>
                                                                    <td>
                                                                        <a href="https://www.pinterest.com/">
                                                                            <div style="background-color:#111111;border-radius:0 16px 0 0">
                                                                                <img border="0" height="120" src="https://ci3.googleusercontent.com/meips/pin1=s0-d-e1-ft#https://i.pinimg.com/150x150/62/7b/ca/627bca37e29749260d52d026dced6402.jpg" style="display:block;width:120px;height:120px;border-radius:0 16px 0 0;border:0;background-color:#efefef;opacity:0.97" width="120">
                                                                            </div>
                                                                        </a>
                                                                    </td>
                                                                </tr>
                                                            </tbody>
                                                        </table>
                                                        <div style="background: #111111 url(&quot;https://i.pinimg.com/banner.jpg&quot;) no-repeat center/cover; color: #ffffff; padding: 8px">shorthand banner with text</div>
                                                        <div style="background-image:url(https://i.pinimg.com/hero.jpg); background-size: contain; background-repeat: no-repeat">longhand hero</div>
                                                    </div>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </td>
                        </tr>
                    </td>
                </tr>
            </table>
        </div>
    </body>
</html>
