env:
  PROJECT_NAME: gmail-notifier
  DIRECTORY: .output

name: Release

on:
  push:
    branches: ['main']
    paths:
      - 'package.json'

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Check version change
        id: version
        uses: rxliuli/version-check@v1
        with:
          file: package.json

  release:
    permissions:
      contents: write
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Zip extensions
        run: |
          pnpm zip
          pnpm zip:firefox

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: 'v${{ needs.version.outputs.version }}'
          name: 'v${{ needs.version.outputs.version }}'
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            ${{ env.DIRECTORY }}/${{ env.PROJECT_NAME }}-${{ needs.version.outputs.version }}-chrome.zip
            ${{ env.DIRECTORY }}/${{ env.PROJECT_NAME }}-${{ needs.version.outputs.version }}-firefox.zip
            ${{ env.DIRECTORY }}/${{ env.PROJECT_NAME }}-${{ needs.version.outputs.version }}-sources.zip

      - name: Push to Chrome Web Store
        uses: extport-dev/actions/push@v1
        with:
          # file/version/extension inferred from .output/, its manifest.json, and extport.config.json.
          store: chrome
          api-key: ${{ secrets.EXTPORT_API_KEY }}

      - name: Push to Firefox AMO
        uses: extport-dev/actions/push@v1
        with:
          store: firefox
          api-key: ${{ secrets.EXTPORT_API_KEY }}

  # Edge and Safari aren't published to their stores yet - only Chrome and
  # Firefox are live, so that's all CI pushes to for now. The Edge push step
  # and the safari job are still in git history (see the commit that removed
  # them) - restore from there once those listings actually exist.
